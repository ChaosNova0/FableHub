# Uploads each release to CurseForge (project 1777898) when /release pushes
# its version tag. The BigWigs packager builds the zip from the tagged commit
# (.pkgmeta says what to leave out and where the changelog is) and uploads it
# for the game version the .toc's Interface maps to (16001: WoW Forever
# 1.60.1). Only CurseForge gets it: the GitHub release is made by /release.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: CurseForge

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: BigWigsMods/packager@v2
        with:
          args: -p 1777898
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
